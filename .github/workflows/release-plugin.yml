name: release-plugin
run-name: "发布插件 · ${{ inputs.display_version || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      display_version:
        description: "版本号（留空取 plugin.json）"
        default: ""
      auth_mode:
        description: "市场认证：个人 PAT / OIDC 可信发布 / 原用户登录 / 官方共享密钥"
        type: choice
        options: [pat, oidc, login, shared]
        default: pat
      publish_market:
        description: "同步插件市场"
        type: boolean
        default: false
      dry_run:
        description: "仅构建打包，不发布"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      packid: ${{ steps.meta.outputs.packid }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vue-tsc -p tsconfig.app.json --noEmit --pretty false
      - run: node --test scripts/publish-market.test.mjs
      - run: pnpm build
      - name: 校验版本及标签
        id: meta
        env:
          DISPLAY_VERSION: ${{ inputs.display_version }}
          RELEASE_SOURCE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: node scripts/publish-market.mjs meta
      - name: 打包插件
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: node scripts/pack-plugin.mjs --out dist-pack --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: oplg
          path: |
            dist-pack/*.oplg
            logo.svg
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: oplg
          path: release-assets
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$COMMIT_SHA" --title "$RELEASE_TAG" --notes "otools-compositor v${RELEASE_VERSION}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/dist-pack/*.oplg release-assets/logo.svg --clobber
      # 获取与使用 OIDC 凭证在同一进程完成，不通过 job outputs 传递秘密。
      # 用户 PAT、登录 Token 和官方共享密钥也显式选择，不做降级回退。
      - name: 授权并提交市场
        if: ${{ inputs.publish_market || (github.event_name == 'push' && vars.OTOOLS_PUBLISH_MARKET == 'true') }}
        env:
          AUTH_MODE: ${{ inputs.auth_mode || vars.XYCLOUD_AUTH_MODE || 'oidc' }}
          XYCLOUD_PAT: ${{ secrets.XYCLOUD_PAT }}
          XYCLOUD_LOGIN_TOKEN: ${{ secrets.XYCLOUD_LOGIN_TOKEN }}
          OTOOLS_MARKET_TOKEN: ${{ secrets.OTOOLS_MARKET_TOKEN }}
          XYCLOUD_OIDC_ISSUER: ${{ vars.XYCLOUD_OIDC_ISSUER }}
          XYCLOUD_OIDC_AUDIENCE: ${{ vars.XYCLOUD_OIDC_AUDIENCE || 'otools-ci' }}
          XYCLOUD_PUBLISHER_ID: ${{ vars.XYCLOUD_PUBLISHER_ID }}
          OTOOLS_MARKET_API: ${{ vars.OTOOLS_MARKET_API || 'https://otools-api.lingyun.net/api/v1/otools/plugin/publish' }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/publish-market.mjs
